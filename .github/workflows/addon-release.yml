name: Build ForeverCraft release

on:
  push:
    branches: [main]
    paths: [ForeverCraft/ForeverCraft_Forever.toc]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forevercraft-addon-release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^## Version: //p' ForeverCraft/ForeverCraft_Forever.toc | tr -d '\r')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          archive="ForeverCraft-$tag.zip"
          zip -qr "$archive" ForeverCraft
          unzip -tq "$archive"
          gh release create "$tag" "$archive" --target "$GITHUB_SHA" \
            --prerelease --title "ForeverCraft $tag" --notes-file RELEASE-NOTES.md
