name: Refresh Forever profession data

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forevercraft-profession-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream thresholds and build ZIP
        id: data
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python3 tools/update_profession_data.py --output dist
      - name: Validate updated ZIP
        if: steps.data.outputs.changed == 'true'
        env:
          ARCHIVE: ${{ steps.data.outputs.archive }}
        run: unzip -tq "$ARCHIVE"
      - name: Save updated ZIP for review
        if: steps.data.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.data.outputs.tag }}
          path: ${{ steps.data.outputs.archive }}
          if-no-files-found: error
